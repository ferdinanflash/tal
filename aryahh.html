<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special For Aryah ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2e0827 0%, #0d0114 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Container Card Glassmorphism */
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6),
                  0 0 30px rgba(255, 51, 102, 0.3);
      text-align: center;
      max-width: 90vw;
    }

    /* Animasi Hati (Love) Utama */
    .heart-box {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 20px 0 30px;
    }

    .heart {
      position: absolute;
      top: 20px;
      left: 10px;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff2a5f, #ff0055);
      transform: rotate(-45deg);
      animation: beat 1.1s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      box-shadow: 0 0 25px #ff2a5f, 0 0 50px #ff0055;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff2a5f, #ff0055);
      border-radius: 50%;
    }

    .heart::before {
      top: -40px;
      left: 0;
    }

    .heart::after {
      left: 40px;
      top: 0;
    }

    /* Teks Nama Aryah */
    .name {
      font-size: 3.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff3366,
                   0 0 20px #ff3366,
                   0 0 30px #ff0055;
      animation: glow 2s ease-in-out infinite alternate;
      margin-bottom: 8px;
    }

    /* Subteks Pesan */
    .message {
      color: #e0e0e0;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
      opacity: 0.9;
    }

    /* Tombol Interaktif */
    .btn {
      margin-top: 25px;
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff2a5f, #ff6699);
      border: none;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4);
      transition: all 0.3s ease;
      outline: none;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 42, 95, 0.6);
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Partikel Hati Background Melayang */
    .bg-heart {
      position: absolute;
      background-color: rgba(255, 51, 102, 0.4);
      transform: rotate(-45deg);
      animation: floatUp 6s infinite linear;
      bottom: -50px;
      pointer-events: none;
    }

    .bg-heart::before,
    .bg-heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: inherit;
      border-radius: 50%;
    }

    .bg-heart::before {
      top: -50%;
      left: 0;
    }

    .bg-heart::after {
      left: 50%;
      top: 0;
    }

    /* Keyframes Animasi */
    @keyframes beat {
      0%, 100% { transform: rotate(-45deg) scale(0.95); }
      15% { transform: rotate(-45deg) scale(1.25); }
      30% { transform: rotate(-45deg) scale(1.05); }
      45% { transform: rotate(-45deg) scale(1.35); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366; }
      to { text-shadow: 0 0 20px #ff6699, 0 0 35px #ff3366, 0 0 50px #ff0055; }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-45deg) scale(0.3);
        opacity: 0;
      }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% {
        transform: translateY(-105vh) rotate(-45deg) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Partikel Hati Melayang di Background -->
  <div class="bg-heart" style="left: 10%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 0s;"></div>
  <div class="bg-heart" style="left: 25%; width: 15px; height: 15px; animation-duration: 7s; animation-delay: 2s;"></div>
  <div class="bg-heart" style="left: 45%; width: 25px; height: 25px; animation-duration: 6s; animation-delay: 1s;"></div>
  <div class="bg-heart" style="left: 65%; width: 18px; height: 18px; animation-duration: 8s; animation-delay: 3s;"></div>
  <div class="bg-heart" style="left: 85%; width: 22px; height: 22px; animation-duration: 5.5s; animation-delay: 0.5s;"></div>

  <!-- Card Utama -->
  <div class="card">
    <div class="heart-box">
      <div class="heart"></div>
    </div>
    <div class="name">Aryah</div>
    <div class="message">You Are Very Special ✨</div>
    <button class="btn" onclick="popHeart()">Touch me ❤️</button>
  </div>

  <script>
    // Fungsi untuk memunculkan efek love melayang saat tombol diklik
    function popHeart() {
      for (let i = 0; i < 8; i++) {
        const heart = document.createElement('div');
        heart.classList.add('bg-heart');
        
        // Ukuran dan posisi acak di sekitar tombol
        const size = Math.random() * 20 + 15;
        heart.style.width = size + 'px';
        heart.style.height = size + 'px';
        heart.style.left = (Math.random() * 80 + 10) + 'vw';
        heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
        
        document.body.appendChild(heart);

        // Hapus elemen setelah selesai animasi
        setTimeout(() => {
          heart.remove();
        }, 4000);
      }
    }
  </script>
</body>
</html>
