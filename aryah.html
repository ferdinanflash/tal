<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special for Aryah ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a0826 0%, #08020f 100%);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    /* Canvas Partikel Latar Belakang */
    #bgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Card Utama Glassmorphism */
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 40px 40px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 30px rgba(255, 51, 102, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    /* Animasi Heartbeat Utama */
    .heart-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .heart {
      position: absolute;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff3366, #ff0055);
      transform: rotate(-45deg);
      animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
      box-shadow: 0 0 30px #ff3366, 0 0 60px #ff0055, 0 0 90px #ff3366;
    }
